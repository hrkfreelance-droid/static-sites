name: One-off inspect MATCHA TIMES Japan Pages metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-matcha-times-japan-oneoff.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect safe deployment metadata
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: matcha-times-japan
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}")
          curl -fsS "${auth[@]}" "${api}/pages/projects/${PROJECT_NAME}" -o /tmp/project.json
          curl -fsS "${auth[@]}" "${api}/pages/projects/${PROJECT_NAME}/deployments" -o /tmp/deployments.json
          python3 - /tmp/project.json /tmp/deployments.json <<'PY'
          import json,sys
          p=(json.load(open(sys.argv[1])).get('result') or {})
          rows=json.load(open(sys.argv[2])).get('result') or []
          print('PROJECT')
          for k in ['name','subdomain','production_branch','production_script_name','preview_script_name','uses_functions','framework','framework_version','wrangler_config_hash']:
              print(f'{k}={p.get(k)!r}')
          print('build_config=' + repr(p.get('build_config')))
          print('source_type=' + repr((p.get('source') or {}).get('type')))
          prod=(p.get('deployment_configs') or {}).get('production') or {}
          for k in ['compatibility_date','compatibility_flags','fail_open','usage_model','mode','always_use_latest_compatibility_date']:
              print(f'production_config.{k}={prod.get(k)!r}')
          print('production_config_keys=' + ','.join(sorted(prod.keys())))
          print('DEPLOYMENTS')
          for d in rows[:10]:
              trig=(d.get('deployment_trigger') or {}).get('metadata') or {}
              print('---')
              for k in ['id','environment','url','created_on','uses_functions','wrangler_config_hash']:
                  print(f'{k}={d.get(k)!r}')
              print('commit_message=' + repr(trig.get('commit_message')))
              print('commit_hash=' + repr(trig.get('commit_hash')))
              print('latest_stage=' + repr(d.get('latest_stage')))
              print('build_config=' + repr(d.get('build_config')))
              print('keys=' + ','.join(sorted(d.keys())))
          PY
