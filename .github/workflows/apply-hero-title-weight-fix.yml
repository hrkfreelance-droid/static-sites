name: Apply Hero Title and Japanese Heading Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-title-weight-fix.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix hero title size and Japanese heading weight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('matcha-times-brand-guide/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '\n</style>'
          css = '\n\n/* FC guide display correction: restore full-size hero title and strengthen Japanese headings */\n.hero__title > .ja-only,\n.hero__title > .en-only{\n  display:block;\n  font-family:inherit;\n  font-size:1em;\n  line-height:inherit;\n  letter-spacing:inherit;\n  text-transform:none;\n  font-weight:inherit;\n  margin-bottom:0;\n  color:inherit;\n}\n\nhtml[data-lang="ja"] .hero__title > .ja-only,\nhtml[data-lang="ja"] .h2,\nhtml[data-lang="ja"] .eyebrow,\nhtml[data-lang="ja"] .do-col__head,\nhtml[data-lang="ja"] .type-card__name,\nhtml[data-lang="ja"] .paint-step strong,\nhtml[data-lang="ja"] .logo-downloads__head strong{\n  font-weight:700;\n}\n'
          if 'FC guide display correction: restore full-size hero title' not in s:
              if marker not in s:
                  raise SystemExit('style end marker not found')
              s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "hrkfreelance-droid"
          git config user.email "hrk.freelance@gmail.com"
          git add matcha-times-brand-guide/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore hero title size and strengthen Japanese headings"
          git push origin main
