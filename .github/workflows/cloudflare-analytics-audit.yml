name: Audit Cloudflare Web Analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-analytics-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Audit MATCHA and Machida Cloudflare status
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "Required Cloudflare secrets are not available."
            exit 1
          fi

          request() {
            local url="$1"
            local out="$2"
            local status
            status=$(curl -sS -o "$out" -w '%{http_code}' \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Cloudflare API request failed with HTTP ${status}."
              python3 - "$out" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
              for err in data.get('errors', []):
                  print(f"error code={err.get('code')} message={err.get('message')}")
          except Exception:
              print('Cloudflare returned an unreadable error response.')
          PY
              return 1
            fi
          }

          request "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" /tmp/pages.json

          echo '=== CLOUDFLARE PAGES: MATCHA / MACHIDA ==='
          python3 - /tmp/pages.json > /tmp/projects.tsv <<'PY'
          import json, re, sys

          data = json.load(open(sys.argv[1]))
          if not data.get('success'):
              raise SystemExit('Pages API success=false')

          for p in sorted(data.get('result', []), key=lambda x: x.get('name') or ''):
              name = p.get('name') or ''
              domains = p.get('domains') or []
              subdomain = p.get('subdomain') or ''
              haystack = ' '.join([name, subdomain, *domains])
              if not re.search(r'(matcha|machida)', haystack, re.I):
                  continue

              project_cfg = p.get('build_config') or {}
              canonical_cfg = (p.get('canonical_deployment') or {}).get('build_config') or {}
              latest = p.get('latest_deployment') or {}
              latest_cfg = latest.get('build_config') or {}
              has_tag = bool(project_cfg.get('web_analytics_tag') or canonical_cfg.get('web_analytics_tag') or latest_cfg.get('web_analytics_tag'))
              has_token = bool(project_cfg.get('web_analytics_token') or canonical_cfg.get('web_analytics_token') or latest_cfg.get('web_analytics_token'))
              print('\t'.join([
                  name,
                  subdomain,
                  p.get('production_branch') or '',
                  latest.get('url') or '',
                  str(has_tag).lower(),
                  str(has_token).lower(),
              ]))
          PY

          while IFS=$'\t' read -r project subdomain branch latest_url has_tag has_token; do
            [ -n "$project" ] || continue
            echo "project=${project}"
            echo "  subdomain=${subdomain:-'-'}"
            echo "  production_branch=${branch:-'-'}"
            echo "  latest_url=${latest_url:-'-'}"
            echo "  analytics_tag_present=${has_tag}"
            echo "  analytics_token_present=${has_token}"

            http_status="000"
            beacon="false"
            html_hint="false"
            if [ -n "$subdomain" ]; then
              html="/tmp/live-${project}.html"
              http_status=$(curl -sS -L --compressed -o "$html" -w '%{http_code}' \
                "https://${subdomain}/?cf_analytics_audit=$(date +%s)")
              if grep -Eqi '<!doctype html|<html[ >]' "$html"; then
                html_hint="true"
              fi
              if grep -Eqi 'static\.cloudflareinsights\.com/beacon\.min\.js|data-cf-beacon' "$html"; then
                beacon="true"
              fi
            fi
            echo "  live_http=${http_status}"
            echo "  html_present=${html_hint}"
            echo "  live_beacon_present=${beacon}"
          done < /tmp/projects.tsv

          echo '=== CLOUDFLARE WEB ANALYTICS SITES: MATCHA / MACHIDA ==='
          if request "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/rum/site_info/list" /tmp/rum.json; then
            python3 - /tmp/rum.json <<'PY'
          import json, re, sys

          data = json.load(open(sys.argv[1]))
          if not data.get('success'):
              print('RUM API success=false')
              sys.exit(1)

          matched = []
          for s in data.get('result', []):
              rules = s.get('rules') or []
              hosts = sorted({r.get('host') for r in rules if r.get('host')})
              ruleset = s.get('ruleset') or {}
              zone_name = ruleset.get('zone_name')
              if zone_name:
                  hosts.append(zone_name)
              hosts = sorted(set(hosts))
              haystack = ' '.join(hosts)
              if not re.search(r'(matcha|machida)', haystack, re.I):
                  continue
              matched.append((hosts, bool(s.get('auto_install')), bool(ruleset.get('enabled')), bool(s.get('site_token'))))

          if not matched:
              print('No Web Analytics sites matched matcha/machida by host/ruleset.')
          else:
              for hosts, auto_install, enabled, has_token in matched:
                  print(f"hosts={','.join(hosts) if hosts else '-'}")
                  print(f"  auto_install={str(auto_install).lower()}")
                  print(f"  ruleset_enabled={str(enabled).lower()}")
                  print(f"  site_token_present={str(has_token).lower()}")
          PY
          else
            echo 'RUM/Web Analytics listing is unavailable with the current token permissions.'
          fi

          echo 'Audit completed. No Cloudflare token values were printed.'
