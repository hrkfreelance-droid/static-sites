name: Apply FC Language Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fc-language-cleanup.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clean up FC-facing Japanese and English
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('matcha-times-brand-guide/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('<button class="ui-btn" id="langToggle" type="button" aria-label="Switch language">EN</button>', '<button class="ui-btn" id="langToggle" type="button" aria-label="日本語に切り替え">日本語</button>'),
            ('<p class="hero__meta reveal">FRANCHISE BRAND GUIDE · 2026</p>', '<p class="hero__meta reveal"><span class="ja-only">FC BRAND GUIDE · 2026</span><span class="en-only">FRANCHISE BRAND GUIDE · 2026</span></p>'),
            ('<h1 class="hero__title reveal" data-d="1">Brand<br>Standards</h1>', '<h1 class="hero__title reveal" data-d="1"><span class="ja-only">ブランド<br>ガイド</span><span class="en-only">Brand<br>Standards</span></h1>'),
            ('<p class="hero__sub reveal" data-d="2"><span class="ja-only">For franchise stores &amp; production partners.<br>FC店舗・制作パートナー向け。</span><span class="en-only">For franchise stores &amp; production partners.</span></p>', '<p class="hero__sub reveal" data-d="2"><span class="ja-only">FC店舗・制作パートナー向けのブランドガイドです。</span><span class="en-only">Brand standards for franchise stores and production partners.</span></p>'),
            ('<p class="hero__scroll reveal" data-d="3"><i></i>Scroll</p>', '<p class="hero__scroll reveal" data-d="3"><i></i><span class="ja-only">スクロール</span><span class="en-only">Scroll</span></p>'),

            ('<p class="eyebrow reveal">01<i></i>Logo</p>', '<p class="eyebrow reveal">01<i></i><span class="ja-only">ロゴ</span><span class="en-only">Logo</span></p>'),
            ('<h2 class="h2 reveal" data-d="1">Use the master artwork.</h2>', '<h2 class="h2 reveal" data-d="1"><span class="ja-only">支給データをそのまま使用。</span><span class="en-only">Use the master artwork.</span></h2>'),
            ('<p class="intro reveal" data-d="2"><span class="ja-only">Do not rebuild, retype or distort the logo. ロゴ色は 3435 C / White のみ。</span><span class="en-only">Do not rebuild, retype or distort the logo. Use only 3435 C or white.</span></p>', '<p class="intro reveal" data-d="2"><span class="ja-only">ロゴの再作成・文字打ち・変形は禁止。使用色は PANTONE 3435 C または白のみ。</span><span class="en-only">Do not rebuild, retype or distort the logo. Use only PANTONE 3435 C or white.</span></p>'),
            ('<p class="logo-preview__caption">White logo / PANTONE 3435 C</p>', '<p class="logo-preview__caption"><span class="ja-only">白ロゴ / PANTONE 3435 C 背景</span><span class="en-only">White logo / PANTONE 3435 C background</span></p>'),
            ('<p class="logo-preview__caption logo-preview__caption--right">PANTONE 3435 C / Off-white or white</p>', '<p class="logo-preview__caption logo-preview__caption--right"><span class="ja-only">PANTONE 3435 C ロゴ / 白または淡色背景</span><span class="en-only">PANTONE 3435 C logo / White or light background</span></p>'),
            ('<strong>Logo Assets</strong>\n        <span class="ja-only">支給SVG / 縦・横</span><span class="en-only">Master SVG / vertical &amp; horizontal</span>', '<strong><span class="ja-only">ロゴデータ</span><span class="en-only">Logo Assets</span></strong>\n        <span class="ja-only">SVG / 縦・横</span><span class="en-only">SVG / Vertical &amp; Horizontal</span>'),
            ('<span><span class="logo-download__name">Vertical · Green</span><br><span class="logo-download__meta">SVG</span></span>', '<span><span class="logo-download__name"><span class="ja-only">縦 · グリーン</span><span class="en-only">Vertical · Green</span></span><br><span class="logo-download__meta">SVG</span></span>'),
            ('<span><span class="logo-download__name">Vertical · White</span><br><span class="logo-download__meta">SVG</span></span>', '<span><span class="logo-download__name"><span class="ja-only">縦 · ホワイト</span><span class="en-only">Vertical · White</span></span><br><span class="logo-download__meta">SVG</span></span>'),
            ('<span><span class="logo-download__name">Horizontal · Green</span><br><span class="logo-download__meta">SVG</span></span>', '<span><span class="logo-download__name"><span class="ja-only">横 · グリーン</span><span class="en-only">Horizontal · Green</span></span><br><span class="logo-download__meta">SVG</span></span>'),
            ('<span><span class="logo-download__name">Horizontal · White</span><br><span class="logo-download__meta">SVG</span></span>', '<span><span class="logo-download__name"><span class="ja-only">横 · ホワイト</span><span class="en-only">Horizontal · White</span></span><br><span class="logo-download__meta">SVG</span></span>'),
            ('<h3 class="do-col__head"><span class="ja-only">DO / してよいこと</span><span class="en-only">DO</span></h3>', '<h3 class="do-col__head"><span class="ja-only">推奨</span><span class="en-only">DO</span></h3>'),
            ('<h3 class="do-col__head"><span class="ja-only">DO NOT / してはいけないこと</span><span class="en-only">DO NOT</span></h3>', '<h3 class="do-col__head"><span class="ja-only">禁止</span><span class="en-only">DO NOT</span></h3>'),

            ('<p class="eyebrow reveal">02<i></i>Brand Colour</p>', '<p class="eyebrow reveal">02<i></i><span class="ja-only">ブランドカラー</span><span class="en-only">Brand Colour</span></p>'),
            ('<p class="intro reveal" data-d="2"><span class="ja-only">ブランドカラーは PANTONE 3435 C。RGB / CMYK は下記を使用。</span><span class="en-only">Brand colour: PANTONE 3435 C. Use the RGB / CMYK values below.</span></p>', '<p class="intro reveal" data-d="2"><span class="ja-only">ブランドカラーは PANTONE 3435 C に統一。デジタル・印刷では下記の RGB / CMYK を使用してください。</span><span class="en-only">Use PANTONE 3435 C as the brand colour. Use the RGB / CMYK values below for digital and print production.</span></p>'),
            ('<p class="swatch__label">Brand Colour</p>', '<p class="swatch__label"><span class="ja-only">ブランドカラー</span><span class="en-only">Brand Colour</span></p>'),

            ('<p class="eyebrow reveal">03<i></i>Typography</p>', '<p class="eyebrow reveal">03<i></i><span class="ja-only">書体</span><span class="en-only">Typography</span></p>'),
            ('<h2 class="h2 reveal" data-d="1">Three typefaces.<br>Fixed roles.</h2>', '<h2 class="h2 reveal" data-d="1"><span class="ja-only">使用書体は3種類。<br>用途を固定。</span><span class="en-only">Three typefaces.<br>Fixed roles.</span></h2>'),
            ('<p class="intro reveal" data-d="2"><span class="ja-only">Use each typeface only for its assigned role. 用途を入れ替えない。</span><span class="en-only">Use each typeface only for its assigned role.</span></p>', '<p class="intro reveal" data-d="2"><span class="ja-only">各書体は指定された用途にのみ使用してください。</span><span class="en-only">Use each typeface only for its assigned role.</span></p>'),
            ('<div class="type-card__actions"><span class="font-status font-status--embedded">Embedded SVG preview</span><a class="font-link" href="https://booth.pm/ja/items/3970314" target="_blank" rel="noopener">Get font ↗</a></div>', '<div class="type-card__actions"><a class="font-link" href="https://booth.pm/ja/items/3970314" target="_blank" rel="noopener"><span class="ja-only">フォント入手先 ↗</span><span class="en-only">Font source ↗</span></a></div>'),
            ('<div class="type-card__actions"><span class="font-status">Checking font</span><a class="font-link" href="https://zapf-alphabets.com/fonts/palatino/" target="_blank" rel="noopener">Get / license ↗</a></div>', '<div class="type-card__actions"><a class="font-link" href="https://zapf-alphabets.com/fonts/palatino/" target="_blank" rel="noopener"><span class="ja-only">ライセンス・入手先 ↗</span><span class="en-only">License / source ↗</span></a></div>'),
            ('<div class="type-card__actions"><span class="font-status font-status--embedded">SVG preview</span><a class="font-link" href="https://www.dafont.com/get-show.font" target="_blank" rel="noopener">Get font ↗</a></div>', '<div class="type-card__actions"><a class="font-link" href="https://www.dafont.com/get-show.font" target="_blank" rel="noopener"><span class="ja-only">フォント入手先 ↗</span><span class="en-only">Font source ↗</span></a></div>'),

            ('<p class="eyebrow reveal">04<i></i>Interior Paint</p>', '<p class="eyebrow reveal">04<i></i><span class="ja-only">内装塗装</span><span class="en-only">Interior Paint</span></p>'),
            ('<h2 class="h2 reveal" data-d="1">Match the physical 3435 C chip.</h2>', '<h2 class="h2 reveal" data-d="1"><span class="ja-only">現物の 3435 C チップに合わせる。</span><span class="en-only">Match the physical 3435 C chip.</span></h2>'),
            ('<p class="intro reveal" data-d="2"><span class="ja-only">The physical PANTONE 3435 C chip is the master. 塗料は現物チップの発色に合わせて選定・調合します。</span><span class="en-only">Use the physical PANTONE 3435 C chip as the master reference. Select or custom-mix paint to match it.</span></p>', '<p class="intro reveal" data-d="2"><span class="ja-only">PANTONE 3435 C の現物チップを基準に、塗料を選定・調色してください。</span><span class="en-only">Use the physical PANTONE 3435 C chip as the master reference. Select or custom-mix paint to match it.</span></p>'),
            ('<li class="paint-step reveal"><strong>Physical chip</strong><p><span class="ja-only">画面や印刷した見本ではなく、PANTONE 3435 C の現物チップを使用。</span><span class="en-only">Use the physical PANTONE 3435 C chip, not a screen or printed screenshot.</span></p></li>', '<li class="paint-step reveal"><strong><span class="ja-only">現物チップ</span><span class="en-only">Physical chip</span></strong><p><span class="ja-only">画面や印刷見本ではなく、PANTONE 3435 C の現物チップを使用してください。</span><span class="en-only">Use the physical PANTONE 3435 C chip, not a screen or printed reference.</span></p></li>'),
            ('<li class="paint-step reveal" data-d="1"><strong>Match in daylight</strong><p><span class="ja-only">自然光で色合わせ。既製色または調色で 3435 C に合わせる。</span><span class="en-only">Match in daylight. Use ready-mixed or custom-tinted paint to reach the 3435 C appearance.</span></p></li>', '<li class="paint-step reveal" data-d="1"><strong><span class="ja-only">自然光で色合わせ</span><span class="en-only">Match in daylight</span></strong><p><span class="ja-only">自然光で確認し、既製色または調色で 3435 C の発色に合わせてください。</span><span class="en-only">Match in daylight. Use ready-mixed or custom-tinted paint to reach the 3435 C appearance.</span></p></li>'),
            ('<li class="paint-step reveal" data-d="2"><strong>Test after drying</strong><p><span class="ja-only">試し塗りし、完全乾燥後に現物チップと比較。</span><span class="en-only">Apply a test area and compare with the physical chip after the paint is fully dry.</span></p></li>', '<li class="paint-step reveal" data-d="2"><strong><span class="ja-only">乾燥後に確認</span><span class="en-only">Check after drying</span></strong><p><span class="ja-only">必ず試し塗りを行い、完全乾燥後に現物チップと比較してください。</span><span class="en-only">Apply a test area and compare with the physical chip after the paint is fully dry.</span></p></li>'),
            ('<li class="paint-step reveal" data-d="3"><strong>Matte finish only.</strong><p><span class="ja-only">仕上げはつや消しのみ。光沢・半光沢は使用しない。</span><span class="en-only">Use a matte finish only. Do not use gloss or semi-gloss finishes.</span></p></li>', '<li class="paint-step reveal" data-d="3"><strong><span class="ja-only">つや消しのみ</span><span class="en-only">Matte finish only</span></strong><p><span class="ja-only">仕上げはつや消しのみ。光沢・半光沢は使用しないでください。</span><span class="en-only">Use a matte finish only. Do not use gloss or semi-gloss finishes.</span></p></li>'),
            ('<div class="foot__in"><span>MATCHA TIMES · HEADQUARTERS</span><span>Franchise Brand Guide / 2026</span></div>', '<div class="foot__in"><span><span class="ja-only">MATCHA TIMES · 本部</span><span class="en-only">MATCHA TIMES · HEADQUARTERS</span></span><span><span class="ja-only">FC ブランドガイド / 2026</span><span class="en-only">Franchise Brand Guide / 2026</span></span></div>'),
            ("if(langToggle){langToggle.textContent=lang==='ja'?'EN':'JP';langToggle.setAttribute('aria-label',lang==='ja'?'Switch to English':'日本語に切り替え')}", "if(langToggle){langToggle.textContent=lang==='ja'?'EN':'日本語';langToggle.setAttribute('aria-label',lang==='ja'?'Switch to English':'日本語に切り替え')}")
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit('Missing expected text: ' + old[:90])
            s = s.replace(old, new, 1)

          # Remove device/font-check status styling and behavior. These are internal QA states, not FC-facing content.
          s = re.sub(r'\n\.type-card\.is-missing \.type-card__sample:not\(\.type-card__sample--svg\)\{.*?\}\n\.type-card\.is-missing \.type-card__sample:not\(\.type-card__sample--svg\)::after\{.*?\}', '', s, count=1, flags=re.S)
          s = re.sub(r'\n\.font-status\{.*?\.font-status--embedded::before\{background:var\(--accent-ui\)\}', '', s, count=1, flags=re.S)
          s = s.replace('.type-card__actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}', '.type-card__actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px}', 1)

          s, n = re.subn(r'\n  function fontAvailable\(names\)\{.*?\n  \}\n  var probes=\{.*?\n  \};\n  document\.querySelectorAll\(\'\.type-card\[data-font\]\'\)\.forEach\(function\(card\)\{.*?\n  \}\);', '', s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('Font QA script block not removed')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "hrkfreelance-droid"
          git config user.email "hrk.freelance@gmail.com"
          git add matcha-times-brand-guide/index.html
          git commit -m "Polish FC-facing Japanese and English" || exit 0
          git push origin main
