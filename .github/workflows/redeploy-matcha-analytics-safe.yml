name: Redeploy verified MATCHA sites for Web Analytics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redeploy-matcha-analytics-safe.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: matcha-times-indonesia
            repo: hrkfreelance-droid/matcha-times-indonesia
          - project: matcha-times-pakistan
            repo: hrkfreelance-droid/matcha-times-pakistan
    steps:
      - name: Check out exact verified source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: main

      - name: Deploy unchanged source to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy . --project-name=${{ matrix.project }} --branch=main

      - name: Verify live analytics beacon
        run: |
          set -euo pipefail
          url="https://${{ matrix.project }}.pages.dev/?analytics_verify=$(date +%s)"
          html=$(mktemp)
          for attempt in $(seq 1 12); do
            if curl -fsSL --compressed "$url" -o "$html"; then
              if grep -Eqi 'static\.cloudflareinsights\.com/beacon\.min\.js|data-cf-beacon' "$html"; then
                echo "LIVE PASS: ${{ matrix.project }} Cloudflare Web Analytics beacon is present."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "LIVE FAIL: ${{ matrix.project }} returned HTML but the Cloudflare Web Analytics beacon was not found."
          exit 1
