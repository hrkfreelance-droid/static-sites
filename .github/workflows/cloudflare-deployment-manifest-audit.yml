name: Temporary Cloudflare deployment manifest audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deployment-manifest-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest Machida deployment metadata
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "${api}/pages/projects/machida-shoten-cambodia/deployments" -o /tmp/list.json
          dep_id=$(python3 - /tmp/list.json <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          result=data.get('result') or []
          if not result: raise SystemExit('No deployments')
          print(result[0].get('id') or '')
          PY
          )
          curl -fsS "${auth[@]}" "${api}/pages/projects/machida-shoten-cambodia/deployments/${dep_id}" -o /tmp/dep.json
          python3 - /tmp/dep.json <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          r=data.get('result') or {}
          print('deployment_id=', r.get('id'))
          print('top_level_keys=', sorted(r.keys()))
          files=r.get('files')
          print('files_type=', type(files).__name__)
          if isinstance(files, dict):
              print('files_count=', len(files))
              for p,v in list(sorted(files.items()))[:50]:
                  print(f'file path={p} value={v}')
          elif isinstance(files, list):
              print('files_count=', len(files))
              for v in files[:50]: print('file=',v)
          else:
              print('files_value=', files)
          print('url=', r.get('url'))
          print('environment=', r.get('environment'))
          print('production_branch=', r.get('production_branch'))
          print('deployment_trigger=', r.get('deployment_trigger'))
          cfg=r.get('build_config') or {}
          safe={k:v for k,v in cfg.items() if 'token' not in k.lower() and 'secret' not in k.lower()}
          print('build_config=',safe)
          PY
