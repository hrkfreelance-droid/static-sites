name: Temporary Cloudflare deployment manifest audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deployment-manifest-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest Machida deployment metadata
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "${api}/pages/projects/machida-shoten-cambodia/deployments" -o /tmp/list.json
          dep_id=$(python3 - /tmp/list.json <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          result=data.get('result') or []
          if not result: raise SystemExit('No deployments')
          print(result[0].get('id') or '')
          PY
          )
          curl -fsS "${auth[@]}" "${api}/pages/projects/machida-shoten-cambodia/deployments/${dep_id}" -o /tmp/dep.json
          python3 - /tmp/dep.json <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          r=data.get('result') or {}
          print('deployment_id=', r.get('id'))
          print('top_level_keys=', sorted(r.keys()))
          for key in ['manifest','aliases','url','environment','production_branch','source','deployment_trigger','build_config']:
              val=r.get(key)
              if key=='manifest' and isinstance(val,dict):
                  print('manifest_present=true')
                  print('manifest_entries=', len(val))
                  for p,h in list(sorted(val.items()))[:30]:
                      print(f'manifest_sample path={p} hash={h}')
              elif key=='manifest':
                  print('manifest_present=', val is not None)
              elif key in ['source','deployment_trigger','build_config']:
                  if isinstance(val,dict):
                      safe={k:v for k,v in val.items() if 'token' not in k.lower() and 'secret' not in k.lower()}
                      print(f'{key}={safe}')
                  else:
                      print(f'{key}={val}')
              else:
                  print(f'{key}={val}')
          PY
