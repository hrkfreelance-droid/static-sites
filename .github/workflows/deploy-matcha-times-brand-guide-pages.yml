name: Deploy MATCHA TIMES Brand Guide to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'matcha-times-brand-guide/**'
      - '.github/workflows/deploy-matcha-times-brand-guide-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create matcha-times-brand-guide --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy matcha-times-brand-guide --project-name=matcha-times-brand-guide --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
