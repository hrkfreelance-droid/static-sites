name: Apply Colour Mode Toggle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-color-mode-toggle.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add JP label and green/ivory colour mode
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('matcha-times-brand-guide/index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Language switch: 日本語 -> JP
          s = s.replace(
              '<button class="ui-btn" id="langToggle" type="button" aria-label="日本語に切り替え">日本語</button>',
              '<button class="ui-btn" id="langToggle" type="button" aria-label="日本語に切り替え">JP</button>'
          )
          s = s.replace(
              "langToggle.textContent=lang==='ja'?'EN':'日本語'",
              "langToggle.textContent=lang==='ja'?'EN':'JP'"
          )

          # 2) Add colour mode toggle beside language switch.
          lang_btn = '<button class="ui-btn" id="langToggle" type="button" aria-label="日本語に切り替え">JP</button>'
          theme_btn = lang_btn + '\n    <button class="ui-btn ui-btn--theme" id="themeToggle" type="button" aria-label="Switch green and ivory colour mode" aria-pressed="false" title="Green / Ivory">◐</button>'
          if 'id="themeToggle"' not in s:
              if lang_btn not in s:
                  raise SystemExit('language button marker not found')
              s = s.replace(lang_btn, theme_btn, 1)

          # 3) Theme CSS. Keep actual PANTONE swatch/logo demonstration colours intact;
          #    invert the page surfaces and text between brand green and ivory.
          css_marker = '/* FC colour mode: green / ivory inversion */'
          css = r'''

/* FC colour mode: green / ivory inversion */
.ui-btn--theme{
  width:30px;
  padding-left:8px;
  font-size:15px;
  letter-spacing:0;
  line-height:1;
  opacity:.82;
}
.ui-btn--theme[aria-pressed="true"]{opacity:1}

body,.hero,.sec,.sec--green,.foot,.topbar{transition:background-color .28s var(--ease),color .28s var(--ease),border-color .28s var(--ease)}

html[data-theme="inverse"]{
  --paper:var(--green);
  --ink:var(--off);
  --ink-soft:rgba(245,242,232,.84);
  --muted:rgba(245,242,232,.64);
  --line:rgba(245,242,232,.22);
  --ui-soft:var(--green);
  --warn:var(--off);
  --warn-bg:rgba(245,242,232,.08);
  --accent-ui:var(--off);
  --topbar-bg:rgba(21,71,52,.92);
}
html[data-theme="inverse"] body{background:var(--green);color:var(--off)}

/* Areas that are green in the default mode become ivory. */
html[data-theme="inverse"] .hero,
html[data-theme="inverse"] .sec--green,
html[data-theme="inverse"] .foot{
  background:var(--off);
  color:var(--green);
}

html[data-theme="inverse"] .hero__meta{color:rgba(21,71,52,.66)}
html[data-theme="inverse"] .hero__foot{border-top-color:rgba(21,71,52,.24)}
html[data-theme="inverse"] .hero__sub{color:rgba(21,71,52,.86)}
html[data-theme="inverse"] .hero__scroll{color:rgba(21,71,52,.62)}
html[data-theme="inverse"] .hero__scroll i{background:rgba(21,71,52,.25)}
html[data-theme="inverse"] .hero__scroll i::after{background:var(--green)}

html[data-theme="inverse"] .sec--green .eyebrow{color:rgba(21,71,52,.66)}
html[data-theme="inverse"] .sec--green .eyebrow i{background:rgba(21,71,52,.26)}
html[data-theme="inverse"] .sec--green .intro{color:rgba(21,71,52,.84)}
html[data-theme="inverse"] .paint-steps{border-top-color:rgba(21,71,52,.30)}
html[data-theme="inverse"] .paint-step{border-bottom-color:rgba(21,71,52,.18)}
html[data-theme="inverse"] .paint-step::before{color:rgba(21,71,52,.48)}
html[data-theme="inverse"] .paint-step p{color:rgba(21,71,52,.78)}

/* Keep brand demonstration panels true to the approved artwork colours. */
html[data-theme="inverse"] .logo-preview__item{background:var(--off)}
html[data-theme="inverse"] .logo-preview__item--green{background:var(--green)}
html[data-theme="inverse"] .type-card__sample--svg img{filter:brightness(0) invert(1)}
html[data-theme="inverse"] .swatch{background:var(--green);color:#fff}
html[data-theme="inverse"] .swatch__label{color:rgba(255,255,255,.68)}

/* Header logic is reversed because data-dark sections are now light. */
html[data-theme="inverse"] .topbar__logo--green{display:none}
html[data-theme="inverse"] .topbar__logo--white{display:block}
html[data-theme="inverse"] .topbar.on-dark{color:rgba(21,71,52,.70);border-bottom-color:rgba(21,71,52,.16)}
html[data-theme="inverse"] .topbar.on-dark .topbar__logo--green{display:block}
html[data-theme="inverse"] .topbar.on-dark .topbar__logo--white{display:none}
html[data-theme="inverse"] .topbar.on-dark.is-solid{background:rgba(245,242,232,.92)}

html[data-theme="inverse"] .progress i{background:var(--off)}
html[data-theme="inverse"] .progress.on-dark i{background:var(--green)}
html[data-theme="inverse"] .indicator{color:rgba(245,242,232,.62)}
html[data-theme="inverse"] .indicator strong{color:var(--off)}
html[data-theme="inverse"] .indicator.on-dark{color:rgba(21,71,52,.60)}
html[data-theme="inverse"] .indicator.on-dark strong{color:var(--green)}

html[data-theme="inverse"] .foot{color:rgba(21,71,52,.64)}
html[data-theme="inverse"] .foot__in{border-top-color:rgba(21,71,52,.22)}
html[data-theme="inverse"] .foot__link{color:rgba(21,71,52,.94);border-color:rgba(21,71,52,.40)}
html[data-theme="inverse"] .foot__link:hover{background:var(--green);color:var(--off);border-color:var(--green)}
'''
          if css_marker not in s:
              if '\n</style>' not in s:
                  raise SystemExit('style end marker not found')
              s = s.replace('\n</style>', css + '\n</style>', 1)

          # 4) Theme JS with persistence.
          js_marker = "var root=document.documentElement;\n  var langToggle=document.getElementById('langToggle');"
          js_replacement = """var root=document.documentElement;\n  var langToggle=document.getElementById('langToggle');\n  var themeToggle=document.getElementById('themeToggle');"""
          if "var themeToggle=document.getElementById('themeToggle');" not in s:
              if js_marker not in s:
                  raise SystemExit('JS root marker not found')
              s = s.replace(js_marker, js_replacement, 1)

          lang_listener = "if(langToggle)langToggle.addEventListener('click',function(){applyLang(root.getAttribute('data-lang')==='ja'?'en':'ja')});"
          theme_js = r'''

  function applyTheme(theme){
    theme=(theme==='inverse')?'inverse':'default';
    if(theme==='inverse')root.setAttribute('data-theme','inverse');
    else root.removeAttribute('data-theme');
    try{localStorage.setItem('mt-brand-theme-v1',theme)}catch(e){}
    if(themeToggle){
      var inverse=theme==='inverse';
      themeToggle.setAttribute('aria-pressed',inverse?'true':'false');
      themeToggle.setAttribute('aria-label',inverse?'Use green-first colour mode':'Use ivory-first colour mode');
    }
  }
  var savedTheme='default';
  try{savedTheme=localStorage.getItem('mt-brand-theme-v1')||'default'}catch(e){}
  applyTheme(savedTheme);
  if(themeToggle)themeToggle.addEventListener('click',function(){applyTheme(root.getAttribute('data-theme')==='inverse'?'default':'inverse')});
'''
          if "function applyTheme(theme)" not in s:
              if lang_listener not in s:
                  raise SystemExit('language listener marker not found')
              s = s.replace(lang_listener, lang_listener + theme_js, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "hrkfreelance-droid"
          git config user.email "hrk.freelance@gmail.com"
          git add matcha-times-brand-guide/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add JP label and green ivory colour mode toggle"
          git push origin main
