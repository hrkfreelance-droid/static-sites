name: Apply Header Green Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-header-green-fix.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Match sticky header colour to page surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('matcha-times-brand-guide/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.topbar.on-dark.is-solid{background:rgba(4,38,21,.78)}'
          new = '.topbar.on-dark.is-solid{background:var(--green)}'
          if old not in s and new not in s:
              raise SystemExit('default header background marker not found')
          s = s.replace(old, new)

          old2 = 'html[data-theme="inverse"] .topbar.on-dark.is-solid{background:rgba(245,242,232,.92)}'
          new2 = 'html[data-theme="inverse"] .topbar.on-dark.is-solid{background:var(--off)}'
          if old2 not in s and new2 not in s:
              raise SystemExit('inverse header background marker not found')
          s = s.replace(old2, new2)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "hrkfreelance-droid"
          git config user.email "hrk.freelance@gmail.com"
          git add matcha-times-brand-guide/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Match sticky header green to page colour"
          git push origin main
