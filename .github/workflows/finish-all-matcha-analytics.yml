name: Finish remaining MATCHA Cloudflare Web Analytics

on:
  workflow_dispatch:

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Enable and redeploy remaining MATCHA Pages projects
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}")
          json_auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')

          finish_project() {
            local project="$1"
            local host="${project}.pages.dev"
            echo "=== ${project} ==="

            curl -fsS "${auth[@]}" "${api}/pages/projects/${project}" -o "/tmp/project.json"
            if python3 - /tmp/project.json <<'PY'
          import json,sys
          p=(json.load(open(sys.argv[1])).get('result') or {})
          cfg=p.get('build_config') or {}
          can=(p.get('canonical_deployment') or {}).get('build_config') or {}
          lat=(p.get('latest_deployment') or {}).get('build_config') or {}
          tag=cfg.get('web_analytics_tag') or can.get('web_analytics_tag') or lat.get('web_analytics_tag')
          tok=cfg.get('web_analytics_token') or can.get('web_analytics_token') or lat.get('web_analytics_token')
          raise SystemExit(0 if tag and tok else 1)
          PY
            then
              echo 'analytics_config=already_present'
            else
              body=$(python3 - "$host" <<'PY'
          import json,sys
          print(json.dumps({'host':sys.argv[1],'auto_install':False},separators=(',',':')))
          PY
              )
              http=$(curl -sS -o /tmp/rum.json -w '%{http_code}' -X POST "${json_auth[@]}" "${api}/rum/site_info" --data "$body")
              if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
                echo "RUM_CREATE_FAIL HTTP=${http}"
                python3 - /tmp/rum.json <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              for e in d.get('errors',[]): print(f"error_code={e.get('code')} error_message={e.get('message')}")
          except Exception: pass
          PY
                return 1
              fi

              python3 - /tmp/rum.json /tmp/patch.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])).get('result') or {}
          tag=d.get('site_tag'); tok=d.get('site_token')
          if not tag or not tok: raise SystemExit('site_tag/site_token missing')
          json.dump({'build_config':{'web_analytics_tag':tag,'web_analytics_token':tok}},open(sys.argv[2],'w'),separators=(',',':'))
          PY
              curl -fsS -X PATCH "${json_auth[@]}" "${api}/pages/projects/${project}" --data-binary @/tmp/patch.json -o /tmp/patched.json
              echo 'analytics_config=created'
            fi

            curl -fsS "${auth[@]}" "${api}/pages/projects/${project}/deployments" -o /tmp/deployments.json
            dep_id=$(python3 - /tmp/deployments.json <<'PY'
          import json,sys
          for d in json.load(open(sys.argv[1])).get('result') or []:
              if d.get('environment')=='production': print(d.get('id') or ''); break
          else: raise SystemExit('No production deployment')
          PY
            )
            curl -fsS "${auth[@]}" "${api}/pages/projects/${project}/deployments/${dep_id}" -o /tmp/dep.json
            python3 - /tmp/dep.json /tmp/manifest.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])).get('result') or {}
          files=d.get('files') or {}
          if not files: raise SystemExit('Empty manifest')
          json.dump(files,open(sys.argv[2],'w'),separators=(',',':'),sort_keys=True)
          PY

            curl -fsS -X POST "${auth[@]}" "${api}/pages/projects/${project}/deployments" \
              --form-string 'branch=main' \
              --form-string 'commit_dirty=false' \
              --form-string 'commit_message=Activate Cloudflare Web Analytics without changing site assets' \
              --form-string "manifest=$(cat /tmp/manifest.json)" -o /tmp/create.json
            new_id=$(python3 - /tmp/create.json <<'PY'
          import json,sys
          print((json.load(open(sys.argv[1])).get('result') or {}).get('id') or '')
          PY
            )
            [ -n "$new_id" ] || return 1

            final=''
            for i in $(seq 1 60); do
              sleep 2
              curl -fsS "${auth[@]}" "${api}/pages/projects/${project}/deployments/${new_id}" -o /tmp/status.json || continue
              final=$(python3 - /tmp/status.json <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])).get('result') or {}
          print(((r.get('latest_stage') or {}).get('status')) or '')
          PY
              )
              case "$final" in success|failure|canceled) break;; esac
            done
            [ "$final" = success ] || return 1

            html=$(mktemp)
            for i in $(seq 1 20); do
              curl -fsSL --compressed "https://${project}.pages.dev/?analytics_verify=$(date +%s%N)" -o "$html"
              if grep -Eqi 'static\.cloudflareinsights\.com/beacon\.min\.js|data-cf-beacon' "$html"; then
                echo 'LIVE_PASS beacon_present=true'
                return 0
              fi
              sleep 3
            done
            echo 'LIVE_FAIL beacon_present=false'
            return 1
          }

          failures=0
          for project in matcha-times-asakusa matcha-times-brand-guide; do
            finish_project "$project" || failures=$((failures+1))
          done
          echo "failures=${failures}"
          [ "$failures" -eq 0 ]
